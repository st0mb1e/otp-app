spring.application.name=otp_app

# DataSource (PostgreSQL 17)
spring.datasource.url=jdbc:postgresql://localhost:5432/otp_app
spring.datasource.username=otp_user
spring.datasource.password=otp_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# JWT
app.security.jwt.secret=some-secret
app.security.jwt.ttl=PT1H
app.security.jwt.issuer=otp_app

# OTP
app.otp.file-output=otp-codes.log
app.otp.default-code-length=6
app.otp.default-ttl-seconds=300

# Email / SMTP
app.email.username=${EMAIL_USERNAME:}
app.email.password=${EMAIL_PASSWORD:}
app.email.from=${EMAIL_FROM:}
app.email.smtp.host=${MAIL_SMTP_HOST:smtp.example.com}
app.email.smtp.port=${MAIL_SMTP_PORT:587}
app.email.smtp.auth=${MAIL_SMTP_AUTH:true}
app.email.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
app.email.smtp.connectiontimeout=${MAIL_SMTP_CONNECTIONTIMEOUT:10000}
app.email.smtp.timeout=${MAIL_SMTP_TIMEOUT:10000}
app.email.smtp.writetimeout=${MAIL_SMTP_WRITETIMEOUT:10000}

# Telegram bot
app.telegram.bot.token=${TELEGRAM_BOT_TOKEN:}

# Logging
logging.level.org.hibernate.SQL=info
logging.level.org.hibernate.orm.jdbc.bind=warn
